services:
  web:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      FLASK_ENV: development
    volumes:
      - ./app:/app/app
      - ./wsgi.py:/app/wsgi.py
      - ./config.py:/app/config.py
    command: flask run --host=0.0.0.0 --port=5000 --debug
    restart: unless-stopped