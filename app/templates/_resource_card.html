<article class="card">
    {% if resource.image_url %}
    <div class="card__image">
        <img src="{{ resource.image_url }}" alt="{{ resource.title }}">
    </div>
    {% endif %}
    <div class="card__body">
        <div style="margin-bottom:10px;">
            <span class="badge
                {% if resource.status == 'stable' %}badge--green
                {% elif resource.status == 'growing' %}badge--amber
                {% else %}badge--slate{% endif %}">
                {{ resource.status_label }}
            </span>
        </div>

        <h3 class="card__title">{{ resource.title }}</h3>
        <p class="card__desc">{{ resource.tagline or resource.description }}</p>

        {% if resource.topic_list %}
        <div class="card__meta">
            {% for topic in resource.topic_list %}
                <span class="tag">{{ topic }}</span>
            {% endfor %}
        </div>
        {% endif %}

        <div class="card__links">
            {% if resource.url %}
                <a href="{{ resource.url }}" target="_blank" rel="noopener" class="btn btn--primary btn--sm">View on GitHub →</a>
            {% endif %}
        </div>
    </div>
</article>
