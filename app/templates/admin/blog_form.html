{% extends "admin/base.html" %}
{% block title %}{{ "Edit" if post else "New" }} Post — Admin{% endblock %}
{% block content %}
<div class="admin-header">
    <div>
        <h1>{{ "Edit Post" if post else "New Blog Post" }}</h1>
        <p class="muted" style="margin:0;"><a href="{{ url_for('admin.blog_list') }}">← Back</a></p>
    </div>
</div>
<form method="POST" enctype="multipart/form-data" class="admin-form" style="max-width:820px;">
    <div class="form-group">
        <label>Title *</label>
        <input type="text" name="title" required value="{{ post.title if post else '' }}">
    </div>
    <div class="form-group">
        <label>Slug (optional — auto-generated from title)</label>
        <input type="text" name="slug" value="{{ post.slug if post else '' }}" placeholder="my-first-post">
    </div>
    <div class="form-group">
        <label>Summary (shown in blog list)</label>
        <textarea name="summary" rows="2">{{ post.summary if post else '' }}</textarea>
    </div>
    <div class="form-group">
        <label>Content (HTML supported)</label>
        <textarea name="content" rows="16" style="font-family:ui-monospace,monospace;font-size:0.9rem;">{{ post.content if post else '' }}</textarea>
    </div>
    <div class="form-group">
        <label>Tags (comma-separated)</label>
        <input type="text" name="tags" value="{{ post.tags if post else '' }}">
    </div>
    <div class="form-group">
        <label>Cover image {% if post and post.cover_image_url %}(leave empty to keep current){% endif %}</label>
        {% if post and post.cover_image_url %}
            <div style="margin:8px 0;"><img src="{{ post.cover_image_url }}" style="max-width:250px;border-radius:8px;"></div>
        {% endif %}
        <input type="file" name="cover_image" accept=".jpg,.jpeg,.png,.gif,.webp">
    </div>
    <div class="form-group">
        <label>
            <input type="checkbox" name="published" {% if post and post.published %}checked{% endif %}>
            Publish (uncheck to save as draft)
        </label>
    </div>
    <div style="display:flex;gap:10px;margin-top:24px;">
        <button type="submit" class="btn btn--primary">{{ "Save" if post else "Create Post" }}</button>
        <a href="{{ url_for('admin.blog_list') }}" class="btn btn--ghost">Cancel</a>
    </div>
</form>
{% endblock %}
