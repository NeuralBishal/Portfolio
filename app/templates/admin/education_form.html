{% extends "admin/base.html" %}
{% block title %}{{ "Edit" if edu else "New" }} Education — Admin{% endblock %}
{% block content %}
<div class="admin-header">
    <div>
        <h1>{{ "Edit Education" if edu else "New Education Entry" }}</h1>
        <p class="muted" style="margin:0;"><a href="{{ url_for('admin.education_list') }}">← Back</a></p>
    </div>
</div>
<form method="POST" class="admin-form">
    <div class="form-group">
        <label>Institution *</label>
        <input type="text" name="institution" required value="{{ edu.institution if edu else '' }}">
    </div>
    <div class="form-group">
        <label>Degree / Program</label>
        <input type="text" name="degree" value="{{ edu.degree if edu else '' }}">
    </div>
    <div class="form-group" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div>
            <label>Start year</label>
            <input type="text" name="start_year" value="{{ edu.start_year if edu else '' }}" placeholder="2024">
        </div>
        <div>
            <label>End year</label>
            <input type="text" name="end_year" value="{{ edu.end_year if edu else '' }}" placeholder="2028">
        </div>
    </div>
    <div class="form-group">
        <label>Grade / CGPA</label>
        <input type="text" name="grade" value="{{ edu.grade if edu else '' }}" placeholder="YGPA: 8.69/10">
    </div>
    <div class="form-group">
        <label>Details</label>
        <textarea name="details" rows="3">{{ edu.details if edu else '' }}</textarea>
    </div>
    <div class="form-group">
        <label>Display order</label>
        <input type="number" name="display_order" value="{{ edu.display_order if edu else 0 }}">
    </div>
    <div style="display:flex;gap:10px;margin-top:24px;">
        <button type="submit" class="btn btn--primary">{{ "Save" if edu else "Create" }}</button>
        <a href="{{ url_for('admin.education_list') }}" class="btn btn--ghost">Cancel</a>
    </div>
</form>
{% endblock %}
