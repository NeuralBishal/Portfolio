{% extends "admin/base.html" %}
{% block title %}Change Password — Admin{% endblock %}
{% block content %}
<div class="admin-header">
    <div>
        <h1>Change Password</h1>
        <p class="muted" style="margin:0;">Use at least 8 characters.</p>
    </div>
</div>
<form method="POST" class="admin-form" style="max-width:480px;">
    <div class="form-group">
        <label>Current password</label>
        <input type="password" name="current_password" required>
    </div>
    <div class="form-group">
        <label>New password</label>
        <input type="password" name="new_password" required minlength="8">
    </div>
    <div class="form-group">
        <label>Confirm new password</label>
        <input type="password" name="confirm_password" required minlength="8">
    </div>
    <div style="display:flex;gap:10px;margin-top:24px;">
        <button type="submit" class="btn btn--primary">Change Password</button>
        <a href="{{ url_for('admin.dashboard') }}" class="btn btn--ghost">Cancel</a>
    </div>
</form>
{% endblock %}
